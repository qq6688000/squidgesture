name: Build SquidGesture

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install dpkg and ldid
        run: brew install dpkg ldid

      - name: Install Theos
        run: |
          sudo mkdir -p /opt/theos
          sudo chown $(whoami) /opt/theos
          git clone --depth=1 --recursive https://github.com/theos/theos.git /opt/theos

      - name: Install SDK
        run: |
          cd /opt/theos/sdks
          git clone --depth=1 https://github.com/theos/sdks.git sdks-tmp
          cp -r sdks-tmp/iPhoneOS16.5.sdk .
          rm -rf sdks-tmp

      - name: Build
        run: |
          export THEOS=/opt/theos
          export THEOS_PACKAGE_SCHEME=rootless
          make clean || true
          make FINALPACKAGE=1

      - name: Verify dylib
        run: |
          DYLIB=".theos/obj/SquidGesture.dylib"
          echo "=== Architecture ==="
          lipo -info "$DYLIB" || file "$DYLIB"
          echo "=== PAC stubs (arm64e) ==="
          otool -tv -arch arm64e "$DYLIB" | grep -c paciza || echo "0"
          echo "=== Load commands ==="
          otool -L "$DYLIB"
          echo "=== Sections ==="
          otool -l -arch arm64e "$DYLIB" | grep -E 'mod_init|init_offset' | sort -u
          echo "=== cryptid ==="
          otool -l "$DYLIB" | grep -A4 LC_ENCRYPTION_INFO || echo "no cryptid"

      - name: Convert plist to binary
        run: |
          plutil -convert binary1 SquidGesture.plist -o SquidGesture_bplist.plist

      - name: Stage and build deb
        run: |
          DYLIB=".theos/obj/SquidGesture.dylib"
          STAGE="/tmp/squidgesture-stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/DEBIAN"
          mkdir -p "$STAGE/var/jb/Library/MobileSubstrate/DynamicLibraries"

          cp control "$STAGE/DEBIAN/control"
          cp postinst "$STAGE/DEBIAN/postinst"
          chmod 755 "$STAGE/DEBIAN/postinst"

          cp "$DYLIB" "$STAGE/var/jb/Library/MobileSubstrate/DynamicLibraries/SquidGesture.dylib"
          cp SquidGesture_bplist.plist "$STAGE/var/jb/Library/MobileSubstrate/DynamicLibraries/SquidGesture.plist"
          chmod 755 "$STAGE/var/jb/Library/MobileSubstrate/DynamicLibraries/SquidGesture.dylib"

          dpkg-deb --build --root-owner-group "$STAGE" \
            "com.minis.squidgesture_1.0.0_iphoneos-arm64.deb"

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: squidgesture-deb
          path: com.minis.squidgesture_1.0.0_iphoneos-arm64.deb
